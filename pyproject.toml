[project]
name = "building_a_skilled_sdet_crew_for_comprehensive_test_automation"
version = "0.1.0"
description = "building_a_skilled_sdet_crew_for_comprehensive_test_automation using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<=3.13"
dependencies = [
    "crewai[tools]>=0.80.0,<1.0.0"
]

[project.scripts]
building_a_skilled_sdet_crew_for_comprehensive_test_automation = "building_a_skilled_sdet_crew_for_comprehensive_test_automation.main:run"
run_crew = "building_a_skilled_sdet_crew_for_comprehensive_test_automation.main:run"
train = "building_a_skilled_sdet_crew_for_comprehensive_test_automation.main:train"
replay = "building_a_skilled_sdet_crew_for_comprehensive_test_automation.main:replay"
test = "building_a_skilled_sdet_crew_for_comprehensive_test_automation.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
